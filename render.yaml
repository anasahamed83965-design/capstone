# Render blueprint for the Spring Boot backend (Review-II, section 9.4).
# New Blueprint -> connect this repo and Render builds the Dockerfile at the
# repo root. Then fill in the sync:false values below (Dashboard -> Environment).
# Database lives on Railway Postgres; Render connects over its public TCP proxy.
# NOTE: Render has no native Java runtime, so this uses runtime: docker.

services:
  - type: web
    name: babysitter-api
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      # JDBC URL with jdbc: prefix, e.g.
      # jdbc:postgresql://<proxy-host>:<proxy-port>/railway
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Security: never expose the H2 console on the public backend.
      - key: H2_CONSOLE_ENABLED
        value: false
      # Comma-separated; must include the Vercel frontend origin(s).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
