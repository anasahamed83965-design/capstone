name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - name: Build and Run Tests
        run: mvn -B clean verify
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      # Render is connected to the repo and auto-deploys on push, so this
      # hook is optional. Skip (green) when the secret is not configured.
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
      - name: Render auto-deploy note
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK not set; Render auto-deploys from GitHub instead."
