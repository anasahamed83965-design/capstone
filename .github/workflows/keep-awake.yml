name: Keep Render awake

# Render's free instance sleeps after ~15 min of inactivity and takes 50s+
# to wake up, which makes the live API look broken during a demo. Pinging
# the health endpoint every 10 minutes keeps it warm. No secrets required.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the API (retry through cold start)
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
              https://babysitter-api-aaic.onrender.com/api/health || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "API did not respond 200" >&2
          exit 1
